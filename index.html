<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stylos Smith Study | Salón en Trinidad</title>

<meta name="description" content="Reserva tu cita en Stylos Smith Study, salón de belleza en Trinidad Beni.">

<style>
body{
margin:0;
font-family:sans-serif;
background:linear-gradient(135deg,#3a0000,#8b0000,#ff1a1a);
color:white;
text-align:center;
}

/* ANIMACIONES */
.fade{
opacity:0;
transform:translateY(30px);
transition:all .8s;
}

.show{
opacity:1;
transform:translateY(0);
}

/* HERO */
.hero{
padding:70px 20px;
}

.btn{
display:inline-block;
background:#25D366;
padding:15px 30px;
border-radius:40px;
color:white;
text-decoration:none;
margin-top:20px;
}

/* SERVICIOS */
.services{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:20px;
}

.card{
background:#7a0000;
padding:15px;
border-radius:15px;
cursor:pointer;
transition:.3s;
}

.card:hover{
transform:scale(1.05);
}

/* RESERVA */
.reserva{
background:#1a0000;
padding:30px;
margin:20px;
border-radius:20px;
}

select, input{
width:90%;
padding:12px;
margin:10px;
border-radius:10px;
border:none;
}

/* BOTÓN FLOTANTE */
.float{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px;
border-radius:50%;
font-size:22px;
text-decoration:none;
box-shadow:0 5px 15px rgba(0,0,0,.5);
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero fade">
<h1>Salón de Belleza en Trinidad</h1>
<p>Reserva tu cita en segundos</p>
</section>

<!-- SERVICIOS -->
<section class="services fade">
<div class="card" onclick="seleccionar('Maquillaje')">Maquillaje</div>
<div class="card" onclick="seleccionar('Peinados')">Peinados</div>
<div class="card" onclick="seleccionar('Pestañas')">Pestañas</div>
<div class="card" onclick="seleccionar('Uñas')">Uñas</div>
<div class="card" onclick="seleccionar('Balayage')">Balayage</div>
<div class="card" onclick="seleccionar('Facial')">Facial</div>
</section>

<!-- RESERVA -->
<section class="reserva fade">
<h2>📅 Reserva tu cita</h2>

<select id="servicio">
<option value="">Selecciona servicio</option>
<option>Maquillaje</option>
<option>Peinados</option>
<option>Pestañas</option>
<option>Uñas</option>
<option>Balayage</option>
<option>Facial</option>
</select>

<input type="date" id="fecha">
<input type="time" id="hora">

<a class="btn" onclick="reservar()">Confirmar por WhatsApp</a>
</section>

<!-- BOTÓN FLOTANTE -->
<a class="float" href="https://wa.me/59172685867">💬</a>

<script>

/* ANIMACIONES SCROLL */
const faders = document.querySelectorAll('.fade');

window.addEventListener('scroll', () => {
faders.forEach(el => {
const top = el.getBoundingClientRect().top;
if(top < window.innerHeight - 50){
el.classList.add('show');
}
});
});

/* SELECCIONAR SERVICIO */
function seleccionar(serv){
document.getElementById("servicio").value = serv;
window.scrollTo({top:500, behavior:'smooth'});
}

/* RESERVA */
function reservar(){
let serv = document.getElementById("servicio").value;
let fecha = document.getElementById("fecha").value;
let hora = document.getElementById("hora").value;

if(!serv || !fecha || !hora){
alert("Completa todos los campos");
return;
}

let mensaje = `Hola, quiero reservar:
Servicio: ${serv}
Fecha: ${fecha}
Hora: ${hora}`;

let url = "https://wa.me/59172685867?text=" + encodeURIComponent(mensaje);

window.open(url, '_blank');
}
</script>

</body>
</html>
